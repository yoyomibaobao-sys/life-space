name: Run experience card local MP4 v2

on:
  push:
    branches:
      - agent/experience-card-local-mp4-v2

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply integration
        run: python scripts/apply-experience-card-mp4.py

      - name: Install locked dependency
        run: npm install mediabunny@1.51.0 --save-exact

      - name: Run rule tests
        run: node --test tests/*.test.mjs

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run targeted lint
        run: npx eslint app/experience-cards/[id]/page.tsx components/experience-card/ExperienceCardVideoPanel.tsx lib/experience-card-video.ts

      - name: Verify diff
        run: git diff --check

      - name: Commit validated changes and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/apply-experience-card-local-mp4.yml
          rm -f .github/workflows/trigger-experience-card-local-mp4.yml
          rm -f .github/workflows/run-experience-card-local-mp4-v2.yml
          rm -f scripts/apply-experience-card-mp4.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md app/experience-cards/[id]/page.tsx components/experience-card/ExperienceCardVideoPanel.tsx lib/experience-card-video.ts tests/experience-cards.test.mjs package.json package-lock.json .github/workflows scripts/apply-experience-card-mp4.py
          git commit -m "Add local experience card MP4 generation"
          git push origin HEAD:agent/experience-card-local-mp4-v2
