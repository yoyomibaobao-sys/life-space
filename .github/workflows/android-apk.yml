name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: HTTPS website URL loaded by the Android shell
        required: false
        default: https://life-space.uk
      version_code:
        description: Monotonically increasing Android version code
        required: false
        default: "8"
      version_name:
        description: User-facing Android version
        required: false
        default: 1.0.4-rc4
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "mobile-shell/**"
      - "mobile-offline-src/**"
      - "scripts/build-mobile-offline.mjs"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "lib/local-offline-db.ts"
      - "lib/local-owner-context.ts"
      - "lib/local-origin-migration.ts"
      - "lib/image-compression.ts"
      - "lib/archive-cycle-dates.ts"
      - "components/LocalOwnerContextSync.tsx"
      - "components/LocalOriginMigration.tsx"
      - "app/layout.tsx"
      - "app/archive/page.tsx"
      - "app/local/archive/**"
      - "components/MobileBackNavigation.tsx"
      - "components/KeyboardLayoutGuard.tsx"
      - "components/StatusBarTheme.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android/**"
      - "mobile-shell/**"
      - "mobile-offline-src/**"
      - "scripts/build-mobile-offline.mjs"
      - "capacitor.config.ts"
      - "next.config.ts"
      - "lib/local-offline-db.ts"
      - "lib/local-owner-context.ts"
      - "lib/local-origin-migration.ts"
      - "lib/image-compression.ts"
      - "lib/archive-cycle-dates.ts"
      - "components/LocalOwnerContextSync.tsx"
      - "components/LocalOriginMigration.tsx"
      - "app/layout.tsx"
      - "app/archive/page.tsx"
      - "app/local/archive/**"
      - "components/MobileBackNavigation.tsx"
      - "components/KeyboardLayoutGuard.tsx"
      - "components/StatusBarTheme.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.server_url || 'https://life-space.uk' }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code || '8' }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.4-rc4' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Run Android shell contracts
        run: node --test tests/android-shell.test.mjs

      - name: Sync Capacitor Android project
        run: npm run android:sync

      - name: Build and test debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: youshi-cultivation-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/youshi-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/youshi-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Verify permanent release signature
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          EXPECTED_SIGNER_SHA256: ccc03e33fed7ce95dd4d203aa3451a08cdc175874e4a6ae159b81c367164635d
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk | tee "$RUNNER_TEMP/apksigner-report.txt"
          grep -F "Signer #1 certificate SHA-256 digest: $EXPECTED_SIGNER_SHA256" "$RUNNER_TEMP/apksigner-report.txt"

      - name: Prepare signed release metadata
        id: release_metadata
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_RELEASE_APK_PATH: android/app/build/outputs/apk/release/app-release.apk
          ANDROID_RELEASE_MANIFEST_PATH: ${{ runner.temp }}/android-release.json
          ANDROID_MINIMUM_VERSION: "7.0"
        run: node scripts/write-android-release-manifest.mjs

      - name: Upload signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: youshi-cultivation-android-release
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/android-release.json
          if-no-files-found: error

      - name: Publish signed release to website storage
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler r2 object put "life-space-media-canary/${{ steps.release_metadata.outputs.object_key }}" --file android/app/build/outputs/apk/release/app-release.apk --remote --content-type application/vnd.android.package-archive --cache-control no-store
          npx wrangler r2 object put "life-space-media-canary/releases/android/release.json" --file "${{ runner.temp }}/android-release.json" --remote --content-type application/json --cache-control no-store

      - name: Verify published release bytes
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler r2 object get "life-space-media-canary/${{ steps.release_metadata.outputs.object_key }}" --file "${{ runner.temp }}/published-android.apk" --remote
          npx wrangler r2 object get "life-space-media-canary/releases/android/release.json" --file "${{ runner.temp }}/published-android-release.json" --remote
          cmp android/app/build/outputs/apk/release/app-release.apk "${{ runner.temp }}/published-android.apk"
          cmp "${{ runner.temp }}/android-release.json" "${{ runner.temp }}/published-android-release.json"
