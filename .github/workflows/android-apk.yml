name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: HTTPS website URL loaded by the Android shell
        required: false
        default: https://life-space-mobile-ui-polish.vercel.app
      version_code:
        description: Monotonically increasing Android version code
        required: false
        default: "2"
      version_name:
        description: User-facing Android version
        required: false
        default: 1.0.1
  push:
    paths:
      - "android/**"
      - "mobile-shell/**"
      - "capacitor.config.ts"
      - "components/MobileBackNavigation.tsx"
      - "components/StatusBarTheme.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CAPACITOR_SERVER_URL: ${{ inputs.server_url || 'https://life-space-mobile-ui-polish.vercel.app' }}
      ANDROID_VERSION_CODE: ${{ inputs.version_code || '2' }}
      ANDROID_VERSION_NAME: ${{ inputs.version_name || '1.0.1' }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install web dependencies
        run: npm ci

      - name: Run Android shell contracts
        run: node --test tests/android-shell.test.mjs

      - name: Sync Capacitor Android project
        run: npm run android:sync

      - name: Build and test debug APK
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: youshi-cultivation-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/youshi-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/youshi-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Upload signed release APK
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v4
        with:
          name: youshi-cultivation-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
