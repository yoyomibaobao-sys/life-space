name: Apply link and signed-out layout refinements

on:
  push:
    branches:
      - agent/refine-links-and-signed-out-layout

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply refinements
        run: python scripts/apply-links-and-signed-out-layout.py

      - name: Install locked dependencies
        run: npm ci

      - name: Run rule tests
        run: node --test tests/*.test.mjs

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run targeted lint
        run: npx eslint app/experience-cards/[id]/page.tsx components/experience-card/ExperienceCardTimeline.tsx lib/experience-cards.ts lib/experience-card-types.ts app/profile/page.tsx app/market/page.tsx app/page.tsx

      - name: Verify diff
        run: git diff --check

      - name: Commit validated changes and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/apply-links-and-signed-out-layout.yml
          rm -f scripts/apply-links-and-signed-out-layout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md app/experience-cards/[id]/page.tsx components/experience-card/ExperienceCardTimeline.tsx lib/experience-cards.ts lib/experience-card-types.ts app/profile/page.tsx app/market/page.tsx app/page.tsx tests/experience-cards.test.mjs tests/navigation-and-signed-out-layout.test.mjs .github/workflows/apply-links-and-signed-out-layout.yml scripts/apply-links-and-signed-out-layout.py
          git commit -m "Refine project links and signed-out layouts"
          git push origin HEAD:agent/refine-links-and-signed-out-layout
