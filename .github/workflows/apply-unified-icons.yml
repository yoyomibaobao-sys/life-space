name: Apply unified icon restoration

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-unified-icons-20260802
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-unified-icons-20260802
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reassemble and apply patch
        shell: bash
        run: |
          cat scripts/restore-unified-icons.patch.gz.b64.part00 scripts/restore-unified-icons.patch.gz.b64.part01 > /tmp/encoded-patch
          python - <<'PY'
          from pathlib import Path
          path = Path('/tmp/encoded-patch')
          value = path.read_text()
          if len(value) == 23651:
              value = value[:3506] + 'g' + value[3506:]
          if len(value) == 23652 and value[10608] == 'W':
              value = value[:10608] + 'X' + value[10609:]
          path.write_text(value)
          PY
          base64 --decode /tmp/encoded-patch | gzip --decompress > /tmp/restore-unified-icons.patch
          git apply --index /tmp/restore-unified-icons.patch

      - name: Normalize generated imports
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('app/archive/[id]/page.tsx'): (
                  'import {\nimport AppIcon from "@/components/ui/AppIcon";\n  isMissingDatabaseColumn,',
                  'import AppIcon from "@/components/ui/AppIcon";\nimport {\n  isMissingDatabaseColumn,',
              ),
              Path('app/archive/page.tsx'): (
                  'import {\nimport AppIcon from "@/components/ui/AppIcon";\n  createLocalTaxonomyItem,',
                  'import AppIcon from "@/components/ui/AppIcon";\nimport {\n  createLocalTaxonomyItem,',
              ),
              Path('components/discover/DiscoverShared.tsx'): (
                  'import {\nimport AppIcon from "@/components/ui/AppIcon";\n  categoryLabel,',
                  'import AppIcon from "@/components/ui/AppIcon";\nimport {\n  categoryLabel,',
              ),
          }
          for path, (old, new) in replacements.items():
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'missing expected import pattern: {path}')
              path.write_text(text.replace(old, new, 1))
          PY
          git add app/archive/[id]/page.tsx app/archive/page.tsx components/discover/DiscoverShared.tsx

      - name: Install locked dependencies
        run: npm ci

      - name: Run rule tests
        run: node --test tests/*.test.mjs

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run targeted lint
        run: npx eslint components/ui/AppIcon.tsx components/ui/RatingStars.tsx components/discover/DiscoverProjectCard.tsx components/discover/FollowedProjectCard.tsx components/archive-ui/ArchiveProjectCard.tsx lib/archive-categories.ts lib/discover-project-feed.ts tests/icon-consistency.test.mjs

      - name: Build production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder-key
        run: npm run build

      - name: Verify patch formatting
        run: git diff --check --cached

      - name: Commit validated changes
        shell: bash
        run: |
          rm -f .github/workflows/export-source-snapshot.yml
          rm -f .github/workflows/apply-unified-icons.yml
          rm -f scripts/restore-unified-icons.patch.gz.b64.part00
          rm -f scripts/restore-unified-icons.patch.gz.b64.part01
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore unified interface icons and project cards"
          git push origin HEAD:agent/restore-unified-icons-20260802
