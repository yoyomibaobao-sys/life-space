name: Apply unified icon restoration

on:
  push:
    branches:
      - agent/restore-unified-icons-20260802

permissions:
  contents: write

concurrency:
  group: apply-unified-icons-20260802
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/restore-unified-icons-20260802
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Reassemble and apply patch
        shell: bash
        run: |
          cat scripts/restore-unified-icons.patch.gz.b64.part00 scripts/restore-unified-icons.patch.gz.b64.part01 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/restore-unified-icons.patch
          git apply --index /tmp/restore-unified-icons.patch

      - name: Install locked dependencies
        run: npm ci

      - name: Run rule tests
        run: node --test tests/*.test.mjs

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run lint
        run: npm run lint

      - name: Build production application
        run: npm run build

      - name: Verify patch formatting
        run: git diff --check --cached

      - name: Commit validated changes
        shell: bash
        run: |
          rm -f .github/workflows/apply-unified-icons.yml
          rm -f scripts/restore-unified-icons.patch.gz.b64.part00
          rm -f scripts/restore-unified-icons.patch.gz.b64.part01
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Restore unified interface icons and project cards"
          git push origin HEAD:agent/restore-unified-icons-20260802
