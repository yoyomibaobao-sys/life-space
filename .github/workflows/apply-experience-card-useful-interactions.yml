name: Apply experience card interactions and useful marks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/experience-card-useful-interactions
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Repair and syntax-check patch script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-experience-card-useful-interactions.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'cards = cards_path.read_text(encoding="utf-8")ncards = cards.replace(',
              'cards = cards_path.read_text(encoding="utf-8")\ncards = cards.replace(',
          )
          path.write_text(text, encoding='utf-8')
          PY
          python -m py_compile scripts/apply-experience-card-useful-interactions.py

      - name: Apply product and interaction changes
        run: python scripts/apply-experience-card-useful-interactions.py

      - name: Install locked dependencies
        run: npm ci

      - name: Run rule tests
        run: node --test tests/*.test.mjs

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Run targeted lint
        run: >-
          npx eslint
          app/experience-cards/[id]/page.tsx
          app/experience-cards/page.tsx
          app/plant/[id]/page.tsx
          app/profile/flowers/page.tsx
          components/archive-detail/ArchiveCommentsSection.tsx
          components/discover-search/DiscoverSearchResults.tsx
          components/experience-card/ExperienceCardInteractions.tsx
          components/experience-card/ExperienceCardListCard.tsx
          components/experience-card/ExperienceCardTimeline.tsx
          components/ui/ProjectMetaLine.tsx
          lib/activity-time.ts
          lib/experience-cards.ts
          lib/user-profile-shared.ts

      - name: Build production application
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
        run: npm run build

      - name: Verify diff
        run: git diff --check

      - name: Commit validated changes and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/apply-experience-card-useful-interactions.yml
          rm -f scripts/apply-experience-card-useful-interactions.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add experience card interactions and useful marks"
          git push origin HEAD:agent/experience-card-useful-interactions
