name: LifeSpace T13 Formal W4 Stage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lifespace-t13-w4-stage
  cancel-in-progress: false

jobs:
  stage-formal-w4:
    name: Build and upload an undeployed W4 version
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://eidltoikfpnrzxruvawf.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_2cw-3WJnyD6x_CnPiDEiqQ_04violBa
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out T13 release source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify immutable source and production account
        shell: bash
        run: |
          set -euo pipefail
          test "${CLOUDFLARE_ACCOUNT_ID}" = "5765d2d135aa20de90c898ab93ad4c11"
          test "$(git rev-parse HEAD^)" = "63ed71a6d233913ac3e327271dc15eee97298eb8"
          test "$(git show -s --format=%T HEAD^)" = "7999d0b3e9bdef1f0336b1d0fad01f17159a5a8b"
          test "$(git diff --name-only HEAD^ HEAD)" = ".github/workflows/cloudflare-canary.yml"
          echo "T13_RELEASE_SOURCE=PASS"
          echo "FORMAL_CLOUDFLARE_ACCOUNT=PASS"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate formal W4 and private media contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run test:w4-formal-config
          npm run typecheck:vinext
          node --test tests/r2-media-service-stage.test.mjs tests/r2-media-business.test.mjs tests/r2-media-gate-switches.test.mjs

      - name: Build formal W4 candidate with both R2 gates closed
        run: npm run build:vinext:formal-candidate

      - name: Assert generated Worker bindings and closed release gates
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import assert from "node:assert/strict";
          const cfg = JSON.parse(fs.readFileSync("dist/server/wrangler.json", "utf8"));
          assert.equal(cfg.name, "life-space-canary");
          assert.equal(cfg.vars?.R2_BUSINESS_MEDIA_MODE, "isolated");
          assert.equal(cfg.vars?.R2_MEDIA_READ_ENABLED, "false");
          assert.equal(cfg.vars?.R2_MEDIA_MIRROR_WRITE_ENABLED, "false");
          assert.ok(cfg.services?.some(s=>s.binding==="R2_BUSINESS_MEDIA_SERVICE" && s.service==="life-space-business-media"));
          assert.ok(cfg.r2_buckets?.some(b=>b.binding==="R2_MEDIA_CANARY" && b.bucket_name==="life-space-media-canary"));
          assert.ok(cfg.assets?.binding==="ASSETS");
          assert.ok(!cfg.triggers?.crons?.length);
          console.log("T13_FORMAL_W4_GENERATED_CONFIG=PASS");
          NODE

      - name: Upload candidate version only (NO production traffic switch)
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --config dist/server/wrangler.json --keep-vars --strict
          echo "T13_W4_VERSION_STAGED_NOT_DEPLOYED=PASS"
