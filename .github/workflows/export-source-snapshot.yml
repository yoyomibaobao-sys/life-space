name: Export source snapshot

on:
  push:
    branches:
      - agent/restore-unified-icons-20260802

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create source archive
        run: |
          tar --exclude=.git -czf /tmp/life-space-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: life-space-source
          path: /tmp/life-space-source.tar.gz
          retention-days: 1
