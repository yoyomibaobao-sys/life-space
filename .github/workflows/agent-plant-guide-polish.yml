name: Agent plant guide polish

on:
  push:
    branches:
      - agent/plant-guide-content-polish

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[agent-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/plant-guide-content-polish
          fetch-depth: 0
      - name: Move difficulty beside summary
        shell: python
        run: |
          from pathlib import Path

          path = Path('app/plant/[id]/page.tsx')
          text = path.read_text()

          old_section = '''function Section({
            title,
            children,
          }: {
            title: string;
            children: ReactNode;
          }) {
            if (!children) return null;

            return (
              <section className={styles.section}>
                <h2 className={styles.sectionTitle}>
                  {title}
                </h2>
                {children}
              </section>
            );
          }'''

          new_section = '''function Section({
            title,
            titleRight,
            children,
          }: {
            title: string;
            titleRight?: ReactNode;
            children: ReactNode;
          }) {
            if (!children) return null;

            return (
              <section className={styles.section}>
                <h2
                  className={styles.sectionTitle}
                  style={
                    titleRight
                      ? {
                          display: "flex",
                          alignItems: "center",
                          justifyContent: "space-between",
                          gap: 12,
                          flexWrap: "wrap",
                        }
                      : undefined
                  }
                >
                  <span>{title}</span>
                  {titleRight ? (
                    <span
                      style={{
                        display: "inline-flex",
                        alignItems: "center",
                        gap: 5,
                        color: "#667260",
                        fontSize: 13,
                        fontWeight: 650,
                      }}
                    >
                      {titleRight}
                    </span>
                  ) : null}
                </h2>
                {children}
              </section>
            );
          }'''

          if old_section not in text:
              raise SystemExit('Section block not found; refusing unsafe edit')
          text = text.replace(old_section, new_section, 1)

          old_difficulty_card = '''    {
              label: copy.parameter_labels.management_difficulty,
              value: difficulty
                ? <span><StarRating rating={difficulty.rating} />（{difficulty.detail}，{difficulty.label}）</span>
                : null,
            },'''
          if old_difficulty_card not in text:
              raise SystemExit('Difficulty parameter card not found; refusing unsafe edit')
          text = text.replace(old_difficulty_card, '', 1)

          old_summary = '''      {isSignedIn && basicOverview ? (
                <Section title={copy.summary}>
                  <TextBlock text={basicOverview} />
                </Section>
              ) : null}'''

          new_summary = '''      {isSignedIn && basicOverview ? (
                <Section
                  title={copy.summary}
                  titleRight={
                    difficulty ? (
                      <>
                        <span>{copy.parameter_labels.management_difficulty}</span>
                        <StarRating rating={difficulty.rating} />
                        <span>（{difficulty.detail}，{difficulty.label}）</span>
                      </>
                    ) : null
                  }
                >
                  <TextBlock text={basicOverview} />
                </Section>
              ) : null}'''

          if old_summary not in text:
              raise SystemExit('Summary block not found; refusing unsafe edit')
          text = text.replace(old_summary, new_summary, 1)

          path.write_text(text)
      - name: Verify edit
        run: |
          git diff --check
          grep -n "titleRight" 'app/plant/[id]/page.tsx'
      - name: Commit edit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/plant/[id]/page.tsx'
          git diff --cached --quiet && exit 0
          git commit -m "ui: move plant difficulty beside summary [agent-applied]"
          git push origin HEAD:agent/plant-guide-content-polish
