name: Trigger natural intro update

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/natural-intro-and-web-nav

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply confirmed copy and navigation changes
        run: python scripts/apply-natural-intro-copy.py

      - name: Install dependencies
        run: npm ci

      - name: Run rule tests
        run: node --test tests/*.test.mjs

      - name: Run TypeScript check
        run: npx tsc --noEmit

      - name: Commit changes and remove temporary files
        shell: bash
        run: |
          rm -f .github/workflows/apply-natural-intro-copy.yml
          rm -f .github/workflows/trigger-natural-intro-copy.yml
          rm -f scripts/apply-natural-intro-copy.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx components/navbar.tsx lib/archive-categories.ts tests/homepage-guide-copy.test.mjs .github/workflows/apply-natural-intro-copy.yml .github/workflows/trigger-natural-intro-copy.yml scripts/apply-natural-intro-copy.py
          git commit -m "Align natural intro copy and web navigation"
          git push origin HEAD:agent/natural-intro-and-web-nav
