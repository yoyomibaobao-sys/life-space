name: Temporary Legacy Media Compression
# One-time operation: first batch of five legacy photos.

on:
  pull_request:
    paths:
      - ".github/compression-trigger.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick jq

      - name: Compress and migrate first five legacy photos
        env:
          ENDPOINT: https://eidltoikfpnrzxruvawf.supabase.co/functions/v1/admin-compress-legacy-media
          OPERATION_ID: first-legacy-compression-batch-20260729
        run: |
          set -euo pipefail
          ids=(
            "0bb8adaf-40a2-4a34-9b07-80a38c396294"
            "b76d4c09-8794-4beb-908b-10e94d86a88b"
            "6d41af08-2eba-4b9a-ad40-76874a5dbe78"
            "d1bf4e26-49d1-4dad-bfce-c68d597ab3e7"
            "f9f13834-ed80-4b2b-8b90-968c2a8a5320"
          )

          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT

          for id in "${ids[@]}"; do
            echo "Preparing $id"
            prepare_json="$(curl --fail-with-body --silent --show-error \
              -X POST "$ENDPOINT" \
              -H 'Content-Type: application/json' \
              -H "x-operation-id: $OPERATION_ID" \
              --data "{\"action\":\"prepare\",\"media_id\":\"$id\"}")"
            echo "$prepare_json" | jq -e '.ok == true' >/dev/null

            signed_url="$(echo "$prepare_json" | jq -r '.signed_url')"
            old_bytes="$(echo "$prepare_json" | jq -r '.old_bytes')"
            input="$workdir/$id-input.jpg"
            output="$workdir/$id-output.jpg"

            curl --fail --silent --show-error --location "$signed_url" --output "$input"
            echo "Downloaded $id: $(stat -c%s "$input") bytes"

            convert "$input" \
              -auto-orient \
              -strip \
              -resize '2048x2048>' \
              -sampling-factor 4:2:0 \
              -interlace Plane \
              -quality 82 \
              "$output"

            dimensions="$(identify -format '%w %h' "$output")"
            width="${dimensions%% *}"
            height="${dimensions##* }"
            new_bytes="$(stat -c%s "$output")"
            test "$new_bytes" -gt 1000
            test "$new_bytes" -lt "$old_bytes"
            test "$width" -le 2048
            test "$height" -le 2048

            echo "Committing $id: $old_bytes -> $new_bytes bytes, ${width}x${height}"
            commit_json="$(curl --fail-with-body --silent --show-error \
              -X POST "$ENDPOINT" \
              -H "x-operation-id: $OPERATION_ID" \
              -F 'action=commit' \
              -F "media_id=$id" \
              -F "width=$width" \
              -F "height=$height" \
              -F "file=@$output;type=image/jpeg")"
            echo "$commit_json" | jq -e '.ok == true and .old_deleted == true' >/dev/null
            echo "$commit_json" | jq '{media_id,old_bytes,new_bytes,saved_bytes,width,height,old_deleted}'
          done
