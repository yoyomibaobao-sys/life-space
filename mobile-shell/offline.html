<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f8f3" />
    <title>有时·耕作｜LifeSpace·自然</title>
    <style>:root {
  color-scheme: light;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: #f6f8f3;
  color: #1f2a1f;
  --green: #4f7b45;
  --green-dark: #315a2d;
  --muted: #6f7b69;
  --line: #dce5d8;
  --card: rgba(255, 255, 255, 0.92);
  --danger: #a0443b;
}

* { box-sizing: border-box; }

html, body, #root { min-height: 100%; }

body {
  margin: 0;
  background:
    radial-gradient(circle at 90% 0%, rgba(196, 218, 186, 0.35), transparent 28rem),
    #f6f8f3;
}

button, input, select, textarea { font: inherit; }
button { touch-action: manipulation; }

.offline-shell {
  --shell-pad: 16px;
  width: min(760px, 100%);
  min-height: 100vh;
  margin: 0 auto;
  padding: 0 var(--shell-pad) calc(env(safe-area-inset-bottom, 0px) + 94px);
}

.offline-header {
  position: sticky;
  top: 0;
  z-index: 100;
  min-height: calc(50px + env(safe-area-inset-top, 0px));
  display: grid;
  grid-template-columns: 80px minmax(0, 1fr) 80px;
  align-items: end;
  gap: 4px;
  margin: 0 calc(-1 * var(--shell-pad)) 14px;
  padding: calc(5px + env(safe-area-inset-top, 0px)) 8px 5px;
  border-bottom: 1px solid #e2e9df;
  background: rgba(250, 252, 248, 0.97);
  backdrop-filter: blur(10px);
}

.header-spacer { min-width: 0; min-height: 40px; }
.brand-name {
  min-width: 0;
  min-height: 40px;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  color: #213121;
  font-size: 17px;
  font-weight: 820;
  line-height: 1.2;
  text-align: center;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.icon-button, .secondary-button, .primary-button, .danger-button {
  min-height: 44px;
  border-radius: 999px;
  padding: 0 18px;
  border: 1px solid var(--line);
  background: #fff;
  color: var(--green-dark);
  font-weight: 700;
}
.icon-button { min-width: 44px; padding: 0 12px; }
.header-actions { min-width: 0; display: flex; justify-content: flex-end; align-items: center; gap: 4px; }
.header-actions .icon-button { width: 40px; height: 40px; min-width: 40px; min-height: 40px; padding: 0; border: 0; background: transparent; color: #50694c; font-size: 12px; }
.offline-space-identity {
  min-height: calc(86px + env(safe-area-inset-top, 0px));
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) auto 42px;
  align-items: center;
  gap: 10px;
  margin: 0 0 12px;
  padding: calc(12px + env(safe-area-inset-top, 0px)) 2px 10px;
  border-bottom: 1px solid #e3e9df;
}
.offline-space-avatar {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #eaf3e6;
  color: #426c3f;
}
.offline-space-person { min-width: 0; display: grid; gap: 2px; }
.offline-space-person strong { overflow: hidden; color: #243525; font-size: 18px; line-height: 1.2; text-overflow: ellipsis; white-space: nowrap; }
.offline-space-person small { color: #788673; font-size: 12px; }
.offline-space-summary { color: #526b50; font-size: 13px; font-weight: 700; white-space: nowrap; }
.offline-space-menu { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: transparent; color: #50694c; padding: 0; }
.primary-button { border-color: var(--green); background: var(--green); color: #fff; }
.danger-button { border-color: #e4c3be; color: var(--danger); background: #fff9f8; }
button:disabled { opacity: 0.55; }

.notice {
  border: 1px solid #cbdac5;
  border-radius: 18px;
  background: rgba(238, 246, 234, 0.92);
  padding: 15px;
  margin-bottom: 16px;
}
.notice strong { display: block; margin-bottom: 5px; }
.notice p { color: #52644e; line-height: 1.55; margin: 0; font-size: 14px; }
.notice.warning { border-color: #ead9ac; background: #fffaf0; }

.toolbar { display: flex; gap: 10px; margin-bottom: 18px; }
.toolbar > button { flex: 1; }

.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 6px 2px 12px;
}
.section-title h1, .section-title h2 { margin: 0; font-size: 22px; }
.count { color: var(--muted); font-size: 14px; }

.project-list, .record-list { display: grid; gap: 9px; }
.project-card, .record-card, .panel {
  border: 1px solid var(--line);
  border-radius: 20px;
  background: var(--card);
  box-shadow: 0 8px 24px rgba(48, 75, 42, 0.05);
}
.project-card {
  display: grid;
  grid-template-columns: 92px minmax(0, 1fr);
  gap: 14px;
  padding: 12px;
  width: 100%;
  text-align: left;
  color: inherit;
}
.project-cover {
  width: 92px;
  height: 92px;
  border-radius: 15px;
  object-fit: cover;
  background: #e9efe6;
}
.project-cover.placeholder { display: grid; place-items: center; font-size: 30px; }
.project-title { font-size: 18px; font-weight: 750; margin: 3px 0 6px; overflow-wrap: anywhere; }
.project-meta, .record-meta { color: var(--muted); font-size: 13px; line-height: 1.5; }
.project-note { margin-top: 8px; color: #465441; font-size: 14px; line-height: 1.45; }

/* Match the online ProjectSummaryCard hierarchy for local projects. */
.online-project-list { gap: 9px; }
.online-project-card {
  position: relative;
  width: 100%;
  min-width: 0;
  min-height: 128px;
  display: grid;
  grid-template-columns: 112px minmax(0, 1fr);
  gap: 11px;
  padding: 8px;
  overflow: visible;
  border: 1px solid #e1e8de;
  border-radius: 16px;
  background: #fff;
  color: #263527;
  text-align: left;
}
.online-project-media {
  position: relative;
  width: 112px;
  height: 112px;
  align-self: start;
  overflow: hidden;
  display: grid;
  place-items: center;
  border-radius: 13px;
  background: linear-gradient(135deg, #f4f7f1, #eef4ed);
  color: #91a18e;
}
.online-project-image { width: 100%; height: 100%; display: block; object-fit: cover; }
.online-project-category {
  position: absolute;
  top: 8px;
  left: 8px;
  z-index: 1;
  max-width: calc(100% - 16px);
  overflow: hidden;
  padding: 3px 7px;
  border: 1px solid rgba(191, 218, 187, 0.92);
  border-radius: 999px;
  background: rgba(247, 252, 245, 0.94);
  color: #477546;
  font-size: 11.5px;
  font-weight: 750;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.online-project-body {
  min-width: 0;
  min-height: 112px;
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 0 1px;
}
.online-project-title-row { min-width: 0; min-height: 22px; display: flex; align-items: flex-start; gap: 5px; }
.online-project-title { min-width: 0; flex: 1; color: #263527; font-size: 16px; font-weight: 850; line-height: 1.3; overflow-wrap: anywhere; }
.online-project-visibility { flex: 0 0 auto; padding: 3px 1px; color: #5e7258; font-size: 12px; font-weight: 600; line-height: 1.3; }
.online-project-update { min-width: 0; min-height: 16px; overflow: hidden; color: #667463; font-size: 11.5px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
.online-project-classification { min-width: 0; min-height: 15px; color: #667463; font-size: 11.5px; line-height: 1.3; overflow-wrap: anywhere; }
.online-project-footer { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 7px; margin-top: auto; color: #7a8578; font-size: 11.5px; line-height: 1.3; }
.online-project-ended { flex: 0 0 auto; padding: 2px 6px; border: 1px solid #e4d8ca; border-radius: 999px; background: #f6f2ec; color: #7f7668; font-size: 10.5px; font-weight: 750; }

.empty {
  text-align: center;
  padding: 42px 22px;
  color: var(--muted);
}
.empty strong { display: block; color: #32422f; margin-bottom: 8px; font-size: 17px; }

.back-row { margin-bottom: 12px; }
.back-button { border: 0; background: transparent; color: var(--green-dark); font-weight: 750; padding: 10px 2px; }

.panel { padding: 18px; margin-bottom: 14px; }
.panel h1 { margin: 0 0 8px; font-size: 24px; overflow-wrap: anywhere; }
.detail-note { white-space: pre-wrap; line-height: 1.6; color: #3d4c39; }
.action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.action-row button { flex: 1 1 130px; }

.record-card { padding: 16px; }
.record-note { margin: 9px 0 0; white-space: pre-wrap; line-height: 1.55; }
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
.photo-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; background: #e9efe6; }
.record-actions { display: flex; gap: 14px; margin-top: 13px; }
.link-button { border: 0; background: transparent; color: var(--green-dark); padding: 5px 0; font-weight: 700; }
.link-button.danger { color: var(--danger); }

.form { display: grid; gap: 15px; }
.field { display: grid; gap: 7px; }
.field label { font-weight: 700; color: #344431; }
.field small { color: var(--muted); line-height: 1.45; }
.field input, .field select, .field textarea {
  width: 100%;
  min-height: 48px;
  border: 1px solid #cdd7c9;
  border-radius: 13px;
  background: #fff;
  color: #1f2a1f;
  padding: 12px 13px;
  outline: none;
}
.field textarea { min-height: 110px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(79, 123, 69, 0.12); }
.submit-row { display: flex; gap: 10px; margin-top: 4px; }
.submit-row button { flex: 1; }

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
  transform: translateX(-50%);
  width: min(420px, calc(100vw - 32px));
  border-radius: 16px;
  padding: 13px 16px;
  background: #243222;
  color: #fff;
  text-align: center;
  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.22);
  z-index: 20;
}

.loading { display: grid; place-items: center; min-height: 50vh; color: var(--muted); }

@media (max-width: 420px) {
  .offline-shell { --shell-pad: 12px; }
  .project-card { grid-template-columns: 78px minmax(0, 1fr); }
  .project-cover { width: 78px; height: 78px; }
  .photo-grid { grid-template-columns: repeat(2, 1fr); }
}

/* The same compact mobile hierarchy as the online app. */
:root { font-size: 16px; }
.offline-shell { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 94px); }
.header-actions { display: flex; gap: 8px; }
.source-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) auto; gap: 6px; margin-bottom: 12px; }
.source-row button { min-width: 0; min-height: 34px; font-size: 13px; font-weight: 600; border: 1px solid #dfe7d9; border-radius: 999px; background: #fff; color: #5d6957; padding: 0 4px; white-space: nowrap; }
.category-row button { min-width: 0; min-height: 36px; font-size: 13px; font-weight: 600; border: 1px solid var(--line); border-radius: 999px; background: #fff; color: #52644e; padding: 4px 3px; white-space: nowrap; }
.source-row .add-project { padding-inline: 8px; border-color: #4f844b; background: #4f844b; color: #fff; box-shadow: 0 3px 9px rgba(79,132,75,0.16); }
.source-row button[aria-pressed="true"], .category-row button[aria-pressed="true"] { background: #f0fff4; border-color: #8bc58b; color: #2e7d32; font-weight: 700; }
.category-row { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px; margin: 12px 0; }
.project-title, .project-meta, .project-note { display: block; }
.project-title { font-size: 17px; line-height: 1.4; }
.project-note { max-height: 3em; overflow: hidden; }
.section-title h1, .section-title h2, .panel h1, .panel h2 { font-size: 18px; line-height: 1.35; margin-block: 8px 12px; }
.detail-heading { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; align-items: center; gap: 8px; }
.detail-heading h1 { font-size: 20px; line-height: 1.35; text-align: center; overflow-wrap: anywhere; }
.top-tabs { display: flex; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.top-tabs button { flex: 1; min-height: 44px; padding: 8px; border: 0; border-bottom: 2px solid transparent; background: transparent; color: var(--muted); font-size: 16px; font-weight: 600; }
.top-tabs button[aria-pressed="true"] { color: var(--green-dark); border-bottom-color: var(--green); }
.home-section-tabs { margin-top: -4px; }
.guide-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.guide-item { border: 1px solid var(--line); border-radius: 16px; background: #fff; padding: 14px; text-align: left; color: #314131; }
.guide-item strong, .guide-item small { display: block; }
.guide-item small { color: var(--muted); margin-top: 6px; }
.guide-item p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.guide-hero { display: grid; gap: 12px; background: linear-gradient(145deg, #f4faef, #fff); }
.guide-hero h1 { margin: 0; font-size: 25px; }
.guide-hero .primary-button { width: 100%; }
.guide-category { width: fit-content; border-radius: 999px; padding: 5px 10px; background: #e8f3e2; color: var(--green-dark); font-size: 12px; font-weight: 750; }
.guide-overview p { margin: 0; color: #3d4c39; line-height: 1.7; white-space: pre-wrap; }
.guide-parameter-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.guide-parameter { min-width: 0; border: 1px solid #e1e9dd; border-radius: 15px; background: #fafcf8; padding: 13px; }
.guide-parameter small, .guide-parameter strong { display: block; overflow-wrap: anywhere; }
.guide-parameter small { color: var(--muted); margin-bottom: 7px; }
.guide-parameter strong { color: #2f402d; line-height: 1.45; }
.guide-parameter p { margin: 7px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
.guide-access-notice { margin-top: 2px; }
.guide-suggestions { display: flex; flex-wrap: wrap; gap: 6px; }
.guide-suggestions button { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; min-height: 36px; font-size: 14px; background: #f7faf5; color: var(--green-dark); }
.property-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 0; border-bottom: 1px solid #eef2ec; font-size: 14px; }
.property-row > :first-child { color: var(--muted); flex-shrink: 0; }
.property-row > :last-child { min-width: 0; overflow-wrap: anywhere; }
.property-row input[role="switch"] { appearance: none; width: 44px; height: 26px; border-radius: 999px; background: #dde5d8; border: 1px solid #cdd7c9; position: relative; flex-shrink: 0; }
.property-row input[role="switch"]::after { content: ""; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px #0002; transition: transform .15s; }
.property-row input[role="switch"]:checked { background: var(--green); }
.property-row input[role="switch"]:checked::after { transform: translateX(18px); }
.record-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 12px; }
.period-filter { margin-bottom: 12px; }
.field label { font-size: 14px; font-weight: 600; }
.submit-row button { min-width: 0; padding-inline: 8px; font-size: 14px; font-weight: 600; }
.photo-preview { position: relative; }
.photo-preview button { position: absolute; right: 2px; top: 2px; width: 32px; height: 32px; background: #243222d9; color: #fff; border: 0; border-radius: 50%; font-size: 22px; }
.photo-view { border: 0; background: transparent; padding: 0; min-width: 0; }
.single-photo { grid-template-columns: minmax(0, 1fr); }
.single-photo img { max-height: 340px; aspect-ratio: 4/3; }
.photo-lightbox { position: fixed; inset: 0; width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; border: 0; background: #172217f5; z-index: 100; padding: 18px; }
.photo-lightbox img { display: block; width: 100%; height: calc(100% - 60px); object-fit: contain; }
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: min(760px, 100%); height: calc(env(safe-area-inset-bottom, 0px) + 58px); padding: 5px 8px calc(env(safe-area-inset-bottom, 0px) + 5px); display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; background: rgba(255, 255, 255, 0.98); border-top: 1px solid #dfe8da; box-shadow: 0 -8px 22px rgba(40, 62, 34, 0.08); z-index: 30; overflow: visible; }
.bottom-nav button { position: relative; display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center; min-width: 0; border: 0; border-radius: 12px; background: transparent; color: #657160; font-size: 12px; line-height: 1; font-weight: 650; }
.bottom-nav button[aria-current="page"] { background: #edf6e8; color: #2f6a31; font-weight: 800; }
.bottom-nav .quick-add { justify-self: center; width: 48px; height: 48px; margin-top: -16px; border: 3px solid #fff; border-radius: 50%; background: #527b50; color: #fff; box-shadow: 0 5px 14px rgba(46, 79, 43, 0.24); }
.toast { bottom: calc(env(safe-area-inset-bottom, 0px) + 80px); }
@media (max-width: 420px) {
  .online-project-card { grid-template-columns: 112px minmax(0, 1fr); }
}
@media (max-width: 420px) { .guide-parameter-grid { grid-template-columns: 1fr; } }
@media (max-width: 380px) { .source-row { gap: 4px; } .source-row button { font-size: 11.5px; } .source-row .add-project { padding-inline: 5px; } }
@media (max-width: 360px) { .source-row button { font-size: 12px; } }

/*
 * Cold-start offline keeps the same visual hierarchy as the normal mobile app.
 * Connectivity is only a runtime state; local/cloud data identity is unchanged.
 */

.source-row .add-project {
  margin-left: 8px;
}

.panel.empty {
  box-shadow: none;
  background: transparent;
  border-color: transparent;
}

.network-offline {
  min-height: 46vh;
  display: grid;
  place-items: center;
  padding: 24px;
  color: #788276;
  font-size: 15px;
  font-weight: 650;
  text-align: center;
}
