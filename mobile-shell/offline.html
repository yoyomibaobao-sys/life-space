<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f8f3" />
    <title>暂时无法连接｜有时·耕作</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f6f8f3;
        color: #1f2a1f;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f8f3;
      }

      main {
        width: min(340px, calc(100vw - 40px));
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 20px;
      }

      p {
        margin: 0 0 20px;
        color: #6f7b69;
        line-height: 1.6;
      }

      button {
        min-width: 120px;
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        background: #4f7b45;
        color: #fff;
        font: inherit;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>暂时无法连接</h1>
      <p>请检查网络后重试。已保存在 App 内的数据不会因此被删除。</p>
      <button type="button" onclick="window.location.reload()">重新连接</button>
    </main>
  </body>
</html>
