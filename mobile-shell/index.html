<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f6f8f3" />
    <title>有时·耕作</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f6f8f3;
        color: #1f2a1f;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f8f3;
      }

      main {
        padding: 24px;
        text-align: center;
      }

      .mark {
        width: 58px;
        height: 58px;
        margin: 0 auto 16px;
        border-radius: 18px;
        display: grid;
        place-items: center;
        background: #4f7b45;
        color: #fff;
        font-size: 30px;
      }

      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">芽</div>
      <h1>有时·耕作</h1>
    </main>
  </body>
</html>
